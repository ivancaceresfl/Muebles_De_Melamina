<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta
      name="description"
      content="Muebles de melamina funcionales para cada espacio de tu hogar."
    >
    <title>Muebles Melamina | Muebles para tu hogar</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header__content">
        <a class="site-header__brand" href="#inicio">Muebles Melamina</a>
        <p class="site-header__tagline">Diseño y funcionalidad para tu hogar</p>
      </div>
    </header>

    <main id="inicio">
      <section class="catalog" aria-labelledby="catalog-title">
        <div class="catalog__intro">
          <p class="catalog__eyebrow">Hechos para acompañarte</p>
          <h1 id="catalog-title">Nuestro catálogo</h1>
          <p class="catalog__description">
            Encuentra el mueble ideal para organizar y disfrutar tus espacios.
          </p>
        </div>
        <div
          class="catalog__filters"
          id="category-filters"
          role="group"
          aria-label="Filtrar productos por categoría"
        ></div>
        <div class="product-grid" id="product-grid" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; <span id="current-year"></span> Muebles Melamina. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
